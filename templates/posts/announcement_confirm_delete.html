
{% extends "base.html" %}

{% block title %}Delete Announcement | StaffConnect{% endblock %}

{% block content %}
<div class="container">
    <h1>Delete Announcement</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ object.title }}</strong>?
    </p>

    <p>This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn red">
            Confirm Delete
        </button>

        <a href="{% url 'announcement-detail' slug=object.slug %}"
           class="btn-flat">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
