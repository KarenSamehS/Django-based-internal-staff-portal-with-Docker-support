
{% extends "base.html" %}

{% block content %}
<div class="container">
    <h4>Reset Your Password</h4>
    <p>Enter your email address and we'll send you a password reset link if an account matches.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn waves-effect waves-light" type="submit">
            Send Reset Link
        </button>
    </form>
</div>
{% endblock %}
