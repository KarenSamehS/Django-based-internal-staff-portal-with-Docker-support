{% extends "base.html" %}

{% block content %}
<div class="container">
    <h4>My Profile</h4>

    <p>
        Welcome, <strong>{{ request.user.username }}</strong>!
    </p>

    <p>
        <strong>Email:</strong> {{ request.user.email }}
    </p>

    <p>
        <strong>Department:</strong>
        {{ request.user.profile.department|default:"Not specified" }}
    </p>

    <p>
        <strong>Bio:</strong>
        {{ request.user.profile.bio|default:"No bio added yet." }}
    </p>
</div>
{% endblock %}
