
{% extends "base.html" %}

{% block content %}
<div class="container">
    <h4>Create an Account</h4>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn waves-effect waves-light">
            Register
        </button>
    </form>

    <p>Already have an account?
        <a href="{% url 'login' %}">Log in</a>
    </p>
</div>
{% endblock %}
